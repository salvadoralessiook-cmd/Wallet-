<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wallet</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#f4f7fc;color:#24314a}.app{max-width:480px;margin:auto;min-height:100vh;background:white;padding:22px 20px 125px}.brand{color:#838b98;font-size:32px;font-weight:750}.dots{float:right;color:#4285f4;letter-spacing:4px}.panel{border:1px solid #e3e9f3;border-radius:16px;padding:15px;margin-top:20px}.muted{color:#687488;font-size:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.balance{font-size:34px;font-weight:750;margin:8px 0}.photo{width:100%;margin-top:68px;border:3px solid #4285f4;border-radius:18px;padding:4px;background:white;box-shadow:0 7px 18px #0002}.photo img{width:100%;border-radius:12px;display:block}.heading{font-size:18px;font-weight:700;margin-top:28px}.paybar{position:fixed;bottom:0;left:0;right:0;background:white;padding:12px 20px 20px;box-shadow:0 -4px 15px #0002}.paybar>div{max-width:440px;margin:auto}button{cursor:pointer;touch-action:manipulation}.primary{width:100%;border:0;border-radius:15px;background:#1a73e8;color:white;padding:15px;font-size:18px;font-weight:700}.primary:disabled{opacity:.5}.secondary{background:#edf3ff;color:#1557bd;border:0;border-radius:11px;padding:11px 16px;margin-top:8px}.small{font-size:13px}.field{width:100%;font:inherit;padding:12px;border:1px solid #c9d2df;border-radius:10px;margin:7px 0}.shade{display:none;position:fixed;inset:0;background:#152a4d9e;z-index:5;align-items:center;justify-content:center;padding:18px}.shade.show{display:flex}.dialog{width:100%;max-width:390px;background:white;padding:24px;border-radius:24px;text-align:center}.finger{width:110px;height:110px;border:3px solid #4285f4;background:#eaf2ff;color:#1a73e8;border-radius:50%;font-size:58px;margin:15px auto}.check{color:#159b58;font-size:76px;animation:pop .45s ease}@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}.error{color:#b3261e;font-size:13px;min-height:18px}.notice{border-bottom:1px solid #e9edf4;padding:10px 0}.bell{border:0;background:#eaf2ff;border-radius:12px;padding:9px 13px;font-size:19px}.pill{font-size:12px;color:#b3261e}.hide{display:none!important}</style></head><body>
<main class="app"><header class="row"><span class="brand">Wallet</span><span class="dots">● <span style="color:#ea4335">●</span> <span style="color:#fbbc05">●</span></span></header>
<section id="authPanel" class="panel"><b>Ingresá a Wallet</b><input id="email" class="field" type="email" placeholder="Correo electrónico" autocomplete="email"><input id="password" class="field" type="password" placeholder="Contraseña (mínimo 6 caracteres)"><div class="row"><button class="secondary" id="register">Crear cuenta</button><button class="secondary" id="login">Ingresar</button></div><p class="error" id="authError"></p></section>
<section id="userPanel" class="panel hide"><div class="row"><span class="muted" id="emailLabel"></span><button class="secondary small" id="logout">Salir</button></div><label class="muted">Tu nombre de usuario único</label><div class="row"><input id="username" class="field" placeholder="ej. lucas22" maxlength="20"><button id="saveName" class="secondary">Guardar</button></div><div id="myName" class="muted"></div><div class="row" style="margin-top:12px"><b>Notificaciones <span class="pill" id="count"></span></b><button class="bell" id="bell" aria-label="Ver notificaciones">♧</button></div><div id="notifications" class="hide"></div></section>
<div class="muted" style="margin-top:30px">Saldo disponible</div><div id="balance" class="balance">AR$ 5.000.000</div><div class="muted">Saldo de demostración · sin dinero real</div><div class="heading">Mis tarjetas</div><button class="photo" type="button" id="card"><img alt="Tarjeta Spider-Man" src="tarjeta-spiderman-liviana.jpg"></button><p><b>Banco Supervielle · Spider-Man</b></p><div class="muted" id="selected">Tarjeta seleccionada</div></main>
<footer class="paybar"><div><button class="primary" id="pay">Pagar</button><div class="muted" style="text-align:center;margin-top:7px">Pagos ficticios · no se transfieren fondos</div></div></footer><div class="shade" id="shade"><div class="dialog" id="dialog"></div></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
(function(){'use strict';
const config={apiKey:'AIzaSyCs8K7kOjpk2-yhVXauJ4WHRGAOZryuF-E',authDomain:'wallet-1fe9c.firebaseapp.com',projectId:'wallet-1fe9c',storageBucket:'wallet-1fe9c.firebasestorage.app',messagingSenderId:'212538191625',appId:'1:212538191625:web:27f6785ab62573866aedd8'};
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let auth,db,user=null,myName='',balance=5000000,recipient=null,unsub=null,unsubBalance=null,payAmount=50;const showError=(id,msg)=>$(id).textContent=msg;
try{firebase.initializeApp(config);auth=firebase.auth();db=firebase.firestore()}catch(e){showError('authError','No se pudo cargar Firebase. Abrí Wallet con internet en Chrome.');return}
function setBalance(){ $('balance').textContent='AR$ '+balance.toLocaleString('es-AR') }
function open(html){$('dialog').innerHTML=html;$('shade').classList.add('show')}function close(){$('shade').classList.remove('show')}
function errorText(e){const m={'auth/email-already-in-use':'Ese correo ya está registrado.','auth/invalid-email':'Correo electrónico inválido.','auth/weak-password':'La contraseña debe tener al menos 6 caracteres.','auth/invalid-credential':'Correo o contraseña incorrectos.','auth/operation-not-allowed':'Habilitá Correo/Contraseña en Firebase Authentication.','permission-denied':'Firestore rechazó la operación. Revisá las reglas.'};return m[e.code]||e.message||'Ocurrió un error'}
$('register').onclick=async()=>{try{showError('authError','');await auth.createUserWithEmailAndPassword($('email').value.trim(),$('password').value)}catch(e){showError('authError',errorText(e))}};
$('login').onclick=async()=>{try{showError('authError','');await auth.signInWithEmailAndPassword($('email').value.trim(),$('password').value)}catch(e){showError('authError',errorText(e))}};
$('logout').onclick=()=>auth.signOut();
function normalized(s){return s.trim().toLowerCase()}function validName(s){return /^[a-z0-9_]{3,20}$/.test(s)}
$('saveName').onclick=async()=>{if(!user)return;const n=normalized($('username').value);if(!validName(n)){alert('Usá de 3 a 20 letras minúsculas, números o guion bajo.');return}if(myName && myName!==n){alert('El nombre de usuario no se puede cambiar en esta versión.');return}try{await db.collection('handles').doc(n).set({uid:user.uid,createdAt:firebase.firestore.FieldValue.serverTimestamp()});await db.collection('users').doc(user.uid).set({username:n,email:user.email},{merge:true});myName=n;$('myName').textContent='Tu usuario: @'+n;$('username').value=n;$('username').disabled=true;$('saveName').disabled=true}catch(e){alert('No se pudo guardar el nombre: '+errorText(e))}};
function listen(){if(unsub){unsub();unsub=null}unsub=db.collection('notifications').doc(user.uid).collection('items').orderBy('createdAt','desc').limit(30).onSnapshot(s=>{const arr=s.docs.map(d=>d.data());$('count').textContent=arr.length?'('+arr.length+')':'';$('notifications').innerHTML=arr.length?arr.map(n=>'<div class="notice"><b>Te hicieron un pago</b><div class="muted">'+esc(n.senderName||'Otro usuario')+' te envió AR$ '+Number(n.amount||0).toLocaleString('es-AR')+'</div></div>').join(''):'<p class="muted">Todavía no hay notificaciones.</p>'},e=>{$('notifications').textContent='No se pudieron cargar las notificaciones: '+errorText(e)})}
$('bell').onclick=()=>{$('notifications').classList.toggle('hide')};
auth.onAuthStateChanged(async u=>{user=u;myName='';$('authPanel').classList.toggle('hide',!!u);$('userPanel').classList.toggle('hide',!u);if(unsub){unsub();unsub=null}if(unsubBalance){unsubBalance();unsubBalance=null}if(!u)return;unsubBalance=db.collection('balances').doc(u.uid).onSnapshot(d=>{balance=d.exists?Number(d.data().amount):5000000;setBalance()});$('emailLabel').textContent=u.email;try{const doc=await db.collection('users').doc(u.uid).get();if(user?.uid!==u.uid)return;myName=doc.exists?(doc.data().username||''):'';$('username').value=myName;$('username').disabled=!!myName;$('saveName').disabled=!!myName;$('myName').textContent=myName?'Tu usuario: @'+myName:'Elegí un nombre de usuario para recibir pagos';listen()}catch(e){alert('Error al cargar perfil: '+errorText(e))}});
$('pay').onclick=()=>{if(!user){$('email').focus();alert('Primero ingresá a tu cuenta.');return}if(!myName){$('username').focus();alert('Primero guardá tu nombre de usuario.');return}open('<h2>¿A quién querés pagar?</h2><label>Importe en AR$</label><input class="field" id="payAmount" type="number" min="1" step="1" value="50" inputmode="numeric"><input class="field" id="toName" placeholder="Usuario del destinatario"><p class="error" id="payError"></p><button class="primary" id="next">Continuar</button><button class="secondary" id="cancel">Cancelar</button>');$('cancel').onclick=close;$('next').onclick=async()=>{const value=Number($('payAmount').value);if(!Number.isSafeInteger(value)||value<=0||value>balance){showError('payError','Ingresá un importe entero mayor a cero y no superior a tu saldo.');return}payAmount=value;const n=normalized($('toName').value);if(!validName(n)||n===myName){showError('payError','Ingresá otro usuario válido.');return}try{const doc=await db.collection('handles').doc(n).get();if(!doc.exists){showError('payError','Ese usuario no existe.');return}recipient={uid:doc.data().uid,name:n};finger()}catch(e){showError('payError',errorText(e))}}};
function finger(){open('<h2>Confirmar pago</h2><p>AR$ '+payAmount.toLocaleString('es-AR')+' para @'+esc(recipient.name)+'</p><button id="finger" class="finger" aria-label="Apoyar dedo">◎</button><p class="muted">Tocá la huella para confirmar</p><p id="payError" class="error"></p><button class="secondary" id="cancel">Cancelar</button>');$('cancel').onclick=close;$('finger').onclick=finish}
function sound(){try{const C=window.AudioContext||window.webkitAudioContext;const ctx=new C();[523,659,784].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+i*.12;o.frequency.value=f;o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.1,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.start(t);o.stop(t+.22)})}catch(e){}}
async function finish(){const btn=$('finger');btn.disabled=true;showError('payError','Procesando transferencia...');try{const from=db.collection('balances').doc(user.uid),to=db.collection('balances').doc(recipient.uid);const amount=payAmount;await db.runTransaction(async tx=>{const fromDoc=await tx.get(from),toDoc=await tx.get(to);const source=fromDoc.exists?Number(fromDoc.data().amount):5000000;const target=toDoc.exists?Number(toDoc.data().amount):5000000;if(!Number.isSafeInteger(source)||!Number.isSafeInteger(target)||source<amount||target+amount>Number.MAX_SAFE_INTEGER)throw new Error('Saldo insuficiente o saldo inválido');tx.set(from,{amount:source-amount});tx.set(to,{amount:target+amount});const note=db.collection('notifications').doc(recipient.uid).collection('items').doc();tx.set(note,{senderId:user.uid,senderName:myName,amount:amount,message:'Te hicieron un pago',createdAt:firebase.firestore.FieldValue.serverTimestamp()})});sound();open('<div class="check">✓</div><h2>Transferencia realizada</h2><p>AR$ '+amount.toLocaleString('es-AR')+' para @'+esc(recipient.name)+'</p><p class="muted">Los saldos se actualizan en ambas cuentas.</p><button class="secondary" id="done">Finalizar</button>');$('done').onclick=close}catch(e){btn.disabled=false;showError('payError','No se pudo transferir: '+errorText(e))}}
$('card').onclick=()=>{$('selected').textContent='Tarjeta seleccionada ✓'};$('shade').onclick=e=>{if(e.target===$('shade'))close()};
})();
</script></body></html>
